{% extends "base.html" %}
{% block title %}পাসওয়ার্ড পরিবর্তন{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 glass-morphism p-10 rounded-2xl">
        <div class="text-center">
            <div class="mx-auto h-20 w-20 rounded-full bg-gradient-to-r from-gold to-warmOrange flex items-center justify-center">
                <i class="fas fa-key text-4xl text-royal"></i>
            </div>
            <h2 class="mt-6 text-3xl font-bold gradient-text">পাসওয়ার্ড পরিবর্তন</h2>
            <p class="mt-2 text-sm text-gray-300">নতুন পাসওয়ার্ড সেট করুন</p>
        </div>
        <form class="mt-8 space-y-6" method="POST" action="{{ url_for('parent_change_password') }}">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">
                        <i class="fas fa-lock mr-2 text-gold"></i>বর্তমান পাসওয়ার্ড
                    </label>
                    <input type="password" name="current_password" required
                           class="glass-input w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">
                        <i class="fas fa-lock mr-2 text-gold"></i>নতুন পাসওয়ার্ড
                    </label>
                    <input type="password" name="new_password" required
                           class="glass-input w-full">
                </div>
            </div>
            <div>
                <button type="submit" class="btn-3d w-full">
                    <i class="fas fa-save mr-2"></i>হালনাগাদ করুন
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
