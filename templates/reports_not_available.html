{% extends "base.html" %}
{% block title %}রিপোর্ট পাওয়া যায়নি{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16">
    <div class="max-w-2xl mx-auto text-center">
        <div class="glass-morphism rounded-2xl p-12">
            <div class="w-24 h-24 mx-auto bg-gradient-to-r from-gold to-warmOrange rounded-full flex items-center justify-center mb-6">
                <i class="fas fa-clock text-5xl text-royal"></i>
            </div>
            <h1 class="text-3xl font-bold gradient-text mb-4">আজকের রিপোর্ট এখনও প্রস্তুত নয়</h1>
            <p class="text-gray-300 text-lg mb-6">
                আজকের উপস্থিতির রিপোর্ট দেখতে দুপুর ১২:০০ টা পর্যন্ত অপেক্ষা করুন।<br>
                বর্তমান সময়: <span id="currentTime" class="text-gold"></span>
            </p>
            <div class="flex justify-center space-x-4">
                <a href="{{ url_for('attendance_reports') }}?date={{ get_bangladesh_time().date() }}" class="btn-3d">
                    <i class="fas fa-sync-alt mr-2"></i>রিফ্রেশ
                </a>
                <a href="{{ url_for('dashboard') }}" class="bg-deepBlue/50 text-white px-6 py-3 rounded-lg hover:bg-deepBlue transition">
                    <i class="fas fa-arrow-left mr-2"></i>ড্যাশবোর্ড
                </a>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const now = new Date();
    const timeString = now.toLocaleTimeString('bn-BD', { timeZone: 'Asia/Dhaka', hour: '2-digit', minute: '2-digit' });
    document.getElementById('currentTime').textContent = timeString;
});
</script>
{% endblock %}
