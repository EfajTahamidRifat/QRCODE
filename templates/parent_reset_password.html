{% extends "base.html" %}
{% block title %}পাসওয়ার্ড রিসেট করুন{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 glass-morphism p-10 rounded-2xl">
        <div class="text-center">
            <div class="mx-auto h-20 w-20 rounded-full bg-gradient-to-r from-gold to-warmOrange flex items-center justify-center">
                <i class="fas fa-lock-open text-4xl text-royal"></i>
            </div>
            <h2 class="mt-6 text-3xl font-bold gradient-text">পাসওয়ার্ড রিসেট</h2>
            <p class="mt-2 text-sm text-gray-300">আপনার মোবাইলে পাঠানো OTP ও নতুন পাসওয়ার্ড দিন</p>
        </div>
        <form class="mt-8 space-y-6" method="POST" action="{{ url_for('parent_reset_password') }}">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">
                        <i class="fas fa-hashtag mr-2 text-gold"></i>OTP কোড
                    </label>
                    <input type="text" name="otp" required maxlength="6" pattern="[0-9]{6}"
                           class="glass-input w-full" placeholder="৬ ডিজিটের কোড">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">
                        <i class="fas fa-lock mr-2 text-gold"></i>নতুন পাসওয়ার্ড
                    </label>
                    <input type="password" name="new_password" required
                           class="glass-input w-full" placeholder="মিনিমাম ৬ অক্ষর">
                </div>
            </div>
            <div>
                <button type="submit" class="btn-3d w-full">
                    <i class="fas fa-sync-alt mr-2"></i>পাসওয়ার্ড পরিবর্তন করুন
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
