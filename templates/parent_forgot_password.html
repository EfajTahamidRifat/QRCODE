{% extends "base.html" %}
{% block title %}পাসওয়ার্ড রিসেট{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 glass-morphism p-10 rounded-2xl">
        <div class="text-center">
            <div class="mx-auto h-20 w-20 rounded-full bg-gradient-to-r from-gold to-warmOrange flex items-center justify-center">
                <i class="fas fa-key text-4xl text-royal"></i>
            </div>
            <h2 class="mt-6 text-3xl font-bold gradient-text">পাসওয়ার্ড ভুলে গেছেন?</h2>
            <p class="mt-2 text-sm text-gray-300">আপনার মোবাইল নম্বর দিন, OTP পাঠানো হবে</p>
        </div>
        <form class="mt-8 space-y-6" method="POST" action="{{ url_for('parent_forgot_password') }}">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">
                    <i class="fas fa-phone-alt mr-2 text-gold"></i>নিবন্ধিত মোবাইল
                </label>
                <input type="tel" name="phone" required
                       class="glass-input w-full"
                       placeholder="০১৭১২৩৪৫৬৭৮">
            </div>
            <div>
                <button type="submit" class="btn-3d w-full">
                    <i class="fas fa-paper-plane mr-2"></i>OTP পাঠান
                </button>
            </div>
            <div class="text-center">
                <a href="{{ url_for('parent_login') }}" class="text-sm text-gold hover:underline">
                    <i class="fas fa-arrow-left mr-1"></i>লগইন পৃষ্ঠায় ফিরে যান
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
